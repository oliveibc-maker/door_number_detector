services:
  door-number-detector:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      WEB_HOST: 127.0.0.1
      APP_DATA_DIR: /data
      DATABASE_PATH: /data/door_detector.db
      SRC_DB_DRIVER: ODBC Driver 18 for SQL Server
      SRC_DB_TRUSTED: "False"
      HOME: /data/home
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 10m
    volumes:
      - door_detector_data:/data

volumes:
  door_detector_data: