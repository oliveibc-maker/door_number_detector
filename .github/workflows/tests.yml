name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install python-dotenv==1.2.2 uv==0.13.4
      - run: uv lock --check
      - run: uv build
      - run: python -m compileall -q core entrypoint.py web tests
      - run: python -m unittest discover -s tests -v