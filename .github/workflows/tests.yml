name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install uv==0.13.4
      - run: uv lock --check
      - run: uv build
      - run: uv sync --locked --only-group test --no-install-project
      - run: uv run --locked --no-sync python -m compileall -q core entrypoint.py web tests
      - run: uv run --locked --no-sync python -m unittest discover -s tests -v